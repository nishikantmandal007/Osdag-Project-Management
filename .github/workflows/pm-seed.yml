name: Seed issues

# Manual only. Mirrors the source tracker's open issues (from the committed
# snapshot) into this repo. Idempotent via a per-issue marker — safe to
# re-dispatch. One-way: never touches the source.
#
# `limit` lets you mirror just the first N on a first cautious run, then 0
# (= all) once you've eyeballed the result.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repository (OWNER/NAME)"
        required: true
        default: nishikantmandal007/osdagbridge-pm
      apply:
        description: "Apply changes (unchecked = dry run)"
        type: boolean
        default: false
      limit:
        description: "Only mirror the first N issues (0 = all)"
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Seed
        env:
          GH_PM_TOKEN: ${{ secrets.GH_PM_TOKEN }}
          LIMIT: ${{ inputs.limit }}
        run: |
          LIMIT_ARG=""
          if [ "${LIMIT:-0}" != "0" ]; then LIMIT_ARG="--limit ${LIMIT}"; fi
          python -m pm.seed \
            --repo "${{ inputs.repo }}" \
            ${{ inputs.apply && '--apply' || '' }} \
            $LIMIT_ARG
