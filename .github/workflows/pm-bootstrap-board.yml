name: Bootstrap board

# Manual only. Creates a project's Projects V2 board, its fields and its views
# from base.yml + config/software/NAME.yml, and links every source repo in the
# overlay. Idempotent — re-running is a no-op, which is what makes promotion to
# osdag-admin the same command with different inputs.
#
# Runs here rather than locally so GH_PM_TOKEN never leaves Actions.
on:
  workflow_dispatch:
    inputs:
      software:
        description: "Project to build (base.yml + config/software/NAME.yml); source repos come from its overlay"
        required: true
        default: osdagbridge
      owner:
        description: "Login that owns the board"
        required: true
        default: nishikantmandal007
      repo:
        description: "Repo to probe for --check only (OWNER/NAME); source repos come from the overlay"
        required: false
        default: nishikantmandal007/Osdag-Project-Management
      apply:
        description: "Apply changes (unchecked = dry run)"
        type: boolean
        default: false
      check_only:
        description: "Only probe token permissions, change nothing"
        type: boolean
        default: false
      introspect:
        description: "Dump live field-type enum + iteration input shape, change nothing"
        type: boolean
        default: false
      populate:
        description: "Backfill: add every open repo issue to the board (needs apply)"
        type: boolean
        default: false
      rename_from:
        description: "One-time: move the board with THIS title to the config title, then exit (needs apply). e.g. OsdagBridge Delivery"
        required: false
        default: ""

# contents:read is the minimum actions/checkout needs on a private repo.
# Nothing else is granted: the default token cannot write Projects V2 at any
# permission level, so the board work goes through GH_PM_TOKEN.
permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Bootstrap board
        # Inputs are passed via env (not interpolated into the script) and
        # assembled into a bash array, so a value with spaces like
        # "OsdagBridge Delivery" is one argument and nothing is shell-injected.
        env:
          GH_PM_TOKEN: ${{ secrets.GH_PM_TOKEN }}
          SOFTWARE: ${{ inputs.software }}
          OWNER: ${{ inputs.owner }}
          REPO: ${{ inputs.repo }}
          RENAME_FROM: ${{ inputs.rename_from }}
          APPLY: ${{ inputs.apply }}
          CHECK_ONLY: ${{ inputs.check_only }}
          INTROSPECT: ${{ inputs.introspect }}
          POPULATE: ${{ inputs.populate }}
        run: |
          args=(--software "$SOFTWARE" --owner "$OWNER" --repo "$REPO")
          [ -n "$RENAME_FROM" ]      && args+=(--rename-from "$RENAME_FROM")
          [ "$INTROSPECT" = "true" ] && args+=(--introspect)
          [ "$CHECK_ONLY" = "true" ] && args+=(--check)
          [ "$POPULATE" = "true" ]   && args+=(--populate)
          [ "$APPLY" = "true" ]      && args+=(--apply)
          python -m project_management.bootstrap_board "${args[@]}"
