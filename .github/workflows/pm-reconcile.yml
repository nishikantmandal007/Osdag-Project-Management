name: Reconcile

# Nightly drift check. Reports in dry-run; only the manual dispatch may apply.
# A scheduled run that silently fixes things is how a board starts diverging
# from what people think it is, so the automatic path is read-only.
#
# This repo is deliberately NOT a fork — GitHub disables scheduled workflows in
# forks, and this job is the reason the PM system does not live in the code fork.
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC daily; off the hour to dodge scheduler congestion
  workflow_dispatch:
    inputs:
      software:
        description: "Project whose label config to reconcile (base.yml + config/software/NAME.yml)"
        required: false
        default: osdagbridge
      apply:
        description: "Apply changes (unchecked = report only)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "config/**"
      - "pm/**"
      - ".github/workflows/pm-reconcile.yml"

permissions:
  contents: write   # to commit the heartbeat back (schedule only)
  issues: write     # to open/update the drift and health issues

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Config is validated before any network call, so a bad PR fails here
      # rather than halfway through mutating a live tracker.
      - name: Unit tests
        run: |
          pip install pytest
          pytest -q tests/

      # Runs BEFORE the reconciler, on purpose: the heartbeat age must reflect
      # the PREVIOUS run. Reading a just-overwritten heartbeat would always look
      # fresh, and the liveness check — the one that catches a silently dead
      # reconciler — would never fire. Never gates the build.
      - name: Board health
        id: health
        continue-on-error: true
        env:
          GH_PM_TOKEN: ${{ secrets.GH_PM_TOKEN }}
        run: |
          python -m project_management.health --repo "${{ github.repository }}" | tee health.log
          echo "healthy=$(jq -r '.healthy' .health-report.json)" >> "$GITHUB_OUTPUT"

      # The nightly reconciles THIS repo's own process labels (type:/area:), which
      # the drift/health issues below are filed with. Real source repos are
      # reconciled by dropping --repo (a manual dispatch, gated on PAT write). The
      # label config still comes from --software; on schedule/PR it defaults to
      # osdagbridge since no dispatch input is present.
      - name: Reconcile labels
        id: reconcile
        continue-on-error: true
        env:
          GH_PM_TOKEN: ${{ secrets.GH_PM_TOKEN }}
          SOFTWARE: ${{ inputs.software || 'osdagbridge' }}
        run: |
          python -m project_management.reconcile \
            --software "$SOFTWARE" \
            --repo "${{ github.repository }}" \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) && '--apply' || '--dry-run' }} \
            | tee reconcile.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-reports
          path: |
            .drift-report.json
            .health-report.json
            .heartbeat
            reconcile.log
            health.log
          if-no-files-found: warn

      # Scheduled runs only. A PR already shows the log inline, and a human
      # running --apply is watching the output.
      - name: Open or update drift issue
        if: github.event_name == 'schedule' && steps.reconcile.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          # Never interpolate untrusted content into `run:`; the log is read
          # from a file, not from an expression.
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Board drift detected"
          {
            echo "The nightly reconciler found the board no longer matches \`config/\`."
            echo
            echo "Nothing was changed — the scheduled run is read-only, and the reconciler"
            echo "never deletes. Review, then either update \`config/\` or run the"
            echo "**Reconcile** workflow with *Apply* checked."
            echo
            echo '```'
            cat reconcile.log
            echo '```'
            echo
            echo "[Run log]($RUN_URL)"
          } > body.md

          EXISTING=$(gh issue list -R "$REPO" --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$REPO" --body-file body.md
          else
            gh issue create -R "$REPO" --title "$TITLE" --body-file body.md \
              --label "type:chore,area:ci-cd"
          fi

      # Self-healing: one "Board health" issue, edited in place while unhealthy
      # and closed automatically when the board recovers. Editing rather than
      # commenting keeps it a single current snapshot, not a growing thread.
      - name: Open, update or resolve health issue
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEALTHY: ${{ steps.health.outputs.healthy }}
        run: |
          TITLE="Board health"
          EXISTING=$(gh issue list -R "$REPO" --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')

          if [ "$HEALTHY" = "true" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" -R "$REPO" \
                --body "Board healthy again as of [this run]($RUN_URL) — closing."
              gh issue close "$EXISTING" -R "$REPO"
            fi
            exit 0
          fi

          {
            echo "The nightly board-health check flagged items the board is not tracking well."
            echo
            echo "Informational — nothing was changed and the build was not failed."
            echo "Liveness findings mean the reconciler itself may have stopped running;"
            echo "hygiene findings are stale, un-triaged issues (see docs/pm/SOP-01)."
            echo
            echo '```'
            cat health.log
            echo '```'
            echo
            echo "[Run log]($RUN_URL)"
          } > health-body.md

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" -R "$REPO" --body-file health-body.md
          else
            gh issue create -R "$REPO" --title "$TITLE" --body-file health-body.md \
              --label "type:chore,area:ci-cd"
          fi

      # A committed heartbeat is what makes "the nightly stopped" detectable: if
      # this job never runs, the timestamp in git goes stale and the next
      # successful run's health check alarms. always() so even a drift-failed run
      # still records that the automation executed — liveness and drift are
      # independent signals. There is no push trigger, so this cannot loop.
      - name: Persist heartbeat
        if: always() && github.event_name == 'schedule'
        run: |
          git config user.name  "pm-reconciler[bot]"
          git config user.email "pm-reconciler@users.noreply.github.com"
          git add .heartbeat
          if git diff --cached --quiet; then
            echo "heartbeat unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore: reconciler heartbeat [skip ci]"
          git push

      - name: Fail if drift
        if: steps.reconcile.outputs.exit != '0'
        run: |
          echo "::error::reconciler reported drift or failed; see the log above"
          exit 1
