# release.yml — conda 3-channel release pipeline (TEMPLATE)
#
# This lives on a CODE repo (e.g. osdag-admin/OsdagBridge), NOT on the PM repo.
# It builds the conda package once and promotes the SAME artifact through three
# channel labels — dev -> test -> main — one label per release stage, and moves
# the board's "Deploy stage" field to match. See docs/pm/SOP-11-release-pipeline.md.
#
# Three triggers, three promotions:
#   push to default branch  -> build + upload to  dev   (Deploy stage: Dev)
#   push a  v*-rc*  tag      -> copy   dev  -> test      (Deploy stage: Test)
#   publish a GitHub Release -> copy   test -> main      (Deploy stage: In Production)
#
# Secrets required on the code repo:
#   ANACONDA_TOKEN  — anaconda.org token with upload rights to the `osdag` org
#   GH_PM_TOKEN     — the fine-grained PAT that can write the Projects V2 board
#                     (Account -> Projects: R/W). Same token class as the reconciler.
#
# SECURITY: never interpolate ${{ github.event.* }} into a `run:` block — issue
# titles / tag names are attacker-controlled on a public repo. Pass them via `env:`.

name: release

on:
  push:
    branches: [main]
    tags: ["v*-rc*"]
  release:
    types: [published]

permissions:
  contents: read          # least privilege; the board write uses GH_PM_TOKEN, not GITHUB_TOKEN

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── merge to default branch → build once, publish to the dev channel ────────
  build-and-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
      - name: Build the conda package
        shell: bash -el {0}
        run: |
          conda install -y conda-build anaconda-client
          # TODO: point at this repo's recipe (conda.recipe/ or packaging/conda/).
          conda build packaging/conda --output-folder /tmp/artifact
      - name: Upload to the dev channel
        shell: bash -el {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          anaconda -t "$ANACONDA_TOKEN" upload --label dev --force /tmp/artifact/noarch/*.tar.bz2
      - name: Move board Deploy stage → Dev
        env:
          GH_PM_TOKEN: ${{ secrets.GH_PM_TOKEN }}
          DEPLOY_STAGE: "Dev"
        run: ./scripts/set-deploy-stage.sh   # see SOP-11 "Wiring the board update"

  # ── RC tag → promote dev artifact to the test channel (no rebuild) ──────────
  promote-test:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')
    runs-on: ubuntu-latest
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - name: Copy dev → test
        shell: bash -el {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          PKG_SPEC: osdag/PACKAGE/VERSION   # TODO: resolve from the tag, e.g. from RC_TAG below
          RC_TAG: ${{ github.ref_name }}
        run: |
          conda install -y anaconda-client
          anaconda -t "$ANACONDA_TOKEN" copy --from-label dev --to-label test "$PKG_SPEC"
      - name: Move board Deploy stage → Test
        env:
          GH_PM_TOKEN: ${{ secrets.GH_PM_TOKEN }}
          DEPLOY_STAGE: "Test"
        run: ./scripts/set-deploy-stage.sh

  # ── GitHub Release published → promote test artifact to the main channel ────
  promote-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - name: Copy test → main
        shell: bash -el {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          PKG_SPEC: osdag/PACKAGE/VERSION   # TODO: resolve from the release tag
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          conda install -y anaconda-client
          anaconda -t "$ANACONDA_TOKEN" copy --from-label test --to-label main "$PKG_SPEC"
      - name: Move board Deploy stage → In Production
        env:
          GH_PM_TOKEN: ${{ secrets.GH_PM_TOKEN }}
          DEPLOY_STAGE: "In Production"
        run: ./scripts/set-deploy-stage.sh
