# Label taxonomy — the source of truth. The reconciler makes GitHub match this.
#
# CREATE and UPDATE only. Labels present on the repo but absent here are
# REPORTED, never deleted (see pm/reconcile.py). Deleting a label silently
# detaches it from every issue that carried it, and that is unrecoverable.
#
# Renaming: put the old name in `aliases`. The reconciler renames in place,
# which preserves issue associations. Creating a new label and deleting the old
# one would orphan them.
#
# v1 ships three namespaces only — type, sev, area — so triage is three
# decisions per issue. pri/size/epic/status/release are staged for v2, once the
# reconciler can infer them rather than asking a volunteer to pick eight things.

version: 1

namespaces:

  type:
    description: What kind of work this is.
    color: "1D76DB"
    labels:
      - {name: "type:epic",    description: "Outcome-level container; closes when the outcome is achieved"}
      - {name: "type:feature", description: "New user-facing capability"}
      - {name: "type:story",   description: "Sprint-sized unit of user value"}
      - {name: "type:bug",     description: "Something behaves incorrectly"}
      - {name: "type:task",    description: "Sprint-sized unit of work with no direct user story"}
      - {name: "type:chore",   description: "Maintenance; no behaviour change"}
      - {name: "type:spike",   description: "Time-boxed investigation; output is a decision"}
      - {name: "type:docs",    description: "Documentation only"}
      - {name: "type:test",    description: "Verification case or test harness work"}

  sev:
    description: >
      Impact if never fixed. Objective, set by the reporter or at triage.
      Distinct from priority, which is when we schedule it.
    labels:
      - name: "sev:S1-critical"
        color: "B60205"
        description: "Wrong structural output presented as correct, crash, or release blocker"
        triage_sla: "1 business day"
        fix_sla: "current sprint"
      - name: "sev:S2-major"
        color: "D93F0B"
        description: "Feature unusable or value unverifiable; workaround exists"
        triage_sla: "2 business days"
        fix_sla: "current sprint"
      - name: "sev:S3-minor"
        color: "FBCA04"
        description: "Incorrect display or inconsistency with no safety impact"
        triage_sla: "5 business days"
        fix_sla: "within 2 sprints"
      - name: "sev:S4-cosmetic"
        color: "C2E0C6"
        description: "Polish: hover, alignment, spacing"
        triage_sla: "next grooming"
        fix_sla: "unbounded"

  area:
    description: >
      Which subsystem. Multi-valued on purpose — issues routinely span two, so
      the matching board field is MULTI_SELECT, not single-select.
    color: "C5B8E6"
    labels:
      # UI surfaces. `alias` is the label name on Aditya-Donde/OsdagBridge; the
      # reconciler renames in place there rather than orphaning 59 issues.
      - {name: "area:girder-results",    alias: "Girder Results"}
      - {name: "area:output-dock",       alias: "Output Dock"}
      - {name: "area:3d-cad",            alias: "3D CAD"}
      - {name: "area:initial-cad",       alias: "Initial CAD"}
      - {name: "area:plots",             alias: "Plots"}
      - {name: "area:toolbar",           alias: "Toolbar"}
      - {name: "area:typical-section",   alias: "Typical Section Tab"}
      - {name: "area:transverse-member", alias: "Transverse Member"}
      - {name: "area:generate-results",  alias: "Generate Results"}
      - {name: "area:generate-report",   alias: "Generate Report"}
      - {name: "area:analysis-results",  alias: "Analysis Results"}
      - {name: "area:member-properties", alias: "Member Properties - Girder and Stiffener Input"}
      # Code-side areas, no upstream equivalent.
      - {name: "area:design-core",       description: "IRC 22 / IS 800 design pipeline"}
      - {name: "area:analysis-opensees", description: "Grillage model, OpenSees, ospgrillage"}
      - {name: "area:reports",           description: "Report generator and chapters"}
      - {name: "area:ifc-boq",           description: "IFC export and bill of quantities"}
      - {name: "area:packaging",         description: "conda recipe and constructor installer"}
      - {name: "area:memory-stability",  description: "Memory guard, segfaults, subprocess isolation"}
      - {name: "area:cli",               description: "Command-line surface"}
      - {name: "area:web",               description: "Web surface"}
      - {name: "area:ci-cd",             description: "CI workflows and quality gates"}
      - {name: "area:docs",              description: "Documentation"}

# Upstream labels that map onto the new taxonomy. Applied when seeding from
# Aditya-Donde/OsdagBridge so nothing is lost in translation.
migrations:
  "Non-Critical Bug":   "sev:S3-minor"
  "Check & Close":      "status:check-and-close"   # v2 namespace
  "Ready to Merge":     "status:ready-to-merge"    # v2 namespace
  "Future development": "release:future"           # v2 namespace
  "Suggestion":         "type:feature"

# Never touched by the reconciler, even in report-only mode: GitHub ships these
# and other tooling depends on them.
protected:
  - bug
  - documentation
  - duplicate
  - enhancement
  - good first issue
  - help wanted
  - invalid
  - question
  - wontfix
  - dependencies
