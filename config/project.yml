# Projects V2 board — fields and views.
#
# Everything here is created through GraphQL. `gh project` at 2.45.0 cannot
# express any of it: field-create accepts only TEXT/SINGLE_SELECT/DATE/NUMBER
# (no ITERATION, no MULTI_SELECT) and there is no view subcommand at all.
#
# NOT IN THIS FILE, and not automatable: the five built-in board workflows
# (auto-add items, item closed -> Done, PR merged -> Done, auto-archive,
# new issue -> Triage). GitHub exposes deleteProjectV2Workflow and a read-only
# `workflows` field, but no create or update mutation. They are a manual
# checklist in docs/pm/BOARD-SETUP.md. This is also why promotion to another
# repo is not a single command, and why the reconciler cannot heal the part of
# the board most likely to rot.

version: 1

project:
  title: "OsdagBridge Delivery"
  short_description: "Sprints, epics and tiered bugs for OsdagBridge."

fields:
  - name: Status
    type: SINGLE_SELECT
    options:
      - {name: "Backlog",      color: GRAY,   description: "Not yet planned into a sprint"}
      - {name: "Triage",       color: ORANGE, description: "Needs severity, area and an owner"}
      - {name: "Ready",        color: BLUE,   description: "Meets Definition of Ready; can be picked up"}
      - {name: "In Progress",  color: YELLOW, description: "Someone is actively working on it"}
      - {name: "In Review",    color: PURPLE, description: "PR open, awaiting review"}
      - {name: "QA / Verify",  color: PINK,   description: "Merged; being verified against the issue"}
      - {name: "Blocked",      color: RED,    description: "Cannot progress; blocker named in the issue"}
      - {name: "Done",         color: GREEN,  description: "Verified and closed"}

  # 2-week iterations. GraphQL generates the numbered sprints from here;
  # this is what replaces Maya's "Sprint 51:" title-prefix convention.
  - name: Sprint
    type: ITERATION
    duration_days: 14
    start_date: "2026-08-03"   # Monday

  - name: Priority
    type: SINGLE_SELECT
    options:
      - {name: "P0-now",      color: RED,    description: "Preempts current sprint work"}
      - {name: "P1-sprint",   color: ORANGE, description: "This sprint"}
      - {name: "P2-next",     color: YELLOW, description: "Within two sprints"}
      - {name: "P3-backlog",  color: GRAY,   description: "Unbounded"}

  - name: Severity
    type: SINGLE_SELECT
    options:
      - {name: "S1-critical", color: RED,    description: "Wrong structural output presented as correct, crash, or blocker"}
      - {name: "S2-major",    color: ORANGE, description: "Feature unusable or value unverifiable; workaround exists"}
      - {name: "S3-minor",    color: YELLOW, description: "Incorrect display, no safety impact"}
      - {name: "S4-cosmetic", color: GREEN,  description: "Polish"}

  - name: Size
    type: SINGLE_SELECT
    options:
      - {name: "XS", color: GREEN,  description: "Up to 2 hours"}
      - {name: "S",  color: BLUE,   description: "Up to 1 day"}
      - {name: "M",  color: YELLOW, description: "Up to 3 days"}
      - {name: "L",  color: ORANGE, description: "Up to 1 week"}
      - {name: "XL", color: RED,    description: "Too big - split it before starting"}

  - name: Points
    type: NUMBER

  - name: Epic
    type: SINGLE_SELECT
    options:
      - {name: "E1 result-traceability",  color: PURPLE, description: "One value, one source"}
      - {name: "E2 input-integrity",      color: PURPLE, description: "Provenance, persistence, defaults"}
      - {name: "E3 windows-stability",    color: PURPLE, description: "No segfaults or OOM across repeated runs"}
      - {name: "E4 verification-harness", color: PURPLE, description: "DDCL cases and coverage gate"}
      - {name: "E5 ci-quality-gates",     color: PURPLE, description: "PR gate, lint, unified dep manifest"}
      - {name: "E6 release-ga",           color: PURPLE, description: "Reproducible conda package and installer"}
      - {name: "E7 reporting-boq",        color: PURPLE, description: "Report chapters, BOQ, IFC"}
      - {name: "E8 cad-visualization",    color: PURPLE, description: "CAD and plots stay synced with inputs"}
      - {name: "E9 docs-onboarding",      color: PURPLE, description: "README, guides, CONTRIBUTING"}
      - {name: "E10 architecture-debt",   color: PURPLE, description: "God-objects, solver adapters, hygiene"}

  # MULTI_SELECT on purpose. Issue #2 in this very tracker carries both
  # area:design-core and area:transverse-member; a single-select field could
  # not represent it, and most issues span two subsystems.
  - name: Area
    type: MULTI_SELECT
    options:
      - {name: "girder-results",    color: PURPLE, description: ""}
      - {name: "output-dock",       color: PURPLE, description: ""}
      - {name: "3d-cad",            color: PURPLE, description: ""}
      - {name: "initial-cad",       color: PURPLE, description: ""}
      - {name: "plots",             color: PURPLE, description: ""}
      - {name: "toolbar",           color: PURPLE, description: ""}
      - {name: "typical-section",   color: PURPLE, description: ""}
      - {name: "transverse-member", color: PURPLE, description: ""}
      - {name: "generate-results",  color: PURPLE, description: ""}
      - {name: "generate-report",   color: PURPLE, description: ""}
      - {name: "analysis-results",  color: PURPLE, description: ""}
      - {name: "member-properties", color: PURPLE, description: ""}
      - {name: "design-core",       color: BLUE,   description: "IRC 22 / IS 800 design pipeline"}
      - {name: "analysis-opensees", color: BLUE,   description: "Grillage, OpenSees, ospgrillage"}
      - {name: "reports",           color: BLUE,   description: "Report generator and chapters"}
      - {name: "ifc-boq",           color: BLUE,   description: "IFC export and bill of quantities"}
      - {name: "packaging",         color: BLUE,   description: "conda recipe and installer"}
      - {name: "memory-stability",  color: BLUE,   description: "Memory guard, segfaults, subprocess"}
      - {name: "cli",               color: BLUE,   description: ""}
      - {name: "web",               color: BLUE,   description: ""}
      - {name: "ci-cd",             color: BLUE,   description: "CI workflows and quality gates"}
      - {name: "docs",              color: BLUE,   description: ""}

  - name: Target release
    type: SINGLE_SELECT
    options:
      - {name: "v1.0-GA", color: GREEN,  description: ""}
      - {name: "v1.1",    color: BLUE,   description: ""}
      - {name: "v2.0",    color: GRAY,   description: ""}
      - {name: "future",  color: GRAY,   description: "Parked; not staffed"}

  # ROADMAP_LAYOUT needs date fields to render anything. Without these the
  # Epic Roadmap view is blank - caught in review before it shipped.
  - name: Start date
    type: DATE
  - name: Target date
    type: DATE

# Views are created without a filter (CreateProjectV2ViewInput has no filter
# input) and then updated with one. Verified against the live schema.
views:
  - name: "Current Sprint"
    layout: BOARD_LAYOUT
    filter: "sprint:@current -status:Done"
  - name: "Triage Queue"
    layout: TABLE_LAYOUT
    filter: "label:status:needs-triage sort:created-asc"
  - name: "Backlog Grooming"
    layout: TABLE_LAYOUT
    filter: "no:sprint -label:type:epic is:open"
  - name: "Epic Roadmap"
    layout: ROADMAP_LAYOUT
    filter: "label:type:epic"
  - name: "Release v1.0-GA"
    layout: BOARD_LAYOUT
    filter: "milestone:v1.0-GA"
  - name: "By Owner"
    layout: BOARD_LAYOUT
    filter: "sprint:@current is:open"
